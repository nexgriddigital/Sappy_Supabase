<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-label="SAPPY stationery &amp; printing.">
  <defs>
    <clipPath id="sappy-logo-emblem-clip">
      <circle cx="50" cy="50" r="41" />
    </clipPath>
  </defs>
  <!-- Warm ivory / cream textured paper card -->
  <rect width="320" height="340" rx="26" fill="#f3efe4" />
  <rect x="8" y="8" width="304" height="324" rx="20" fill="none" stroke="#e4decb" stroke-width="1.5" />

  <!-- Circular geometric SAPPY emblem -->
  <g transform="translate(90, 42) scale(1.4)">
    <g clip-path="url(#sappy-logo-emblem-clip)" stroke="#324729" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 25.5 15 L 50 90 L 74.5 15" stroke-width="5.6" />
      <path d="M 16.5 22 C 16 41, 22 51.5, 37 51.5 L 63 51.5 C 79 51.5, 86 60, 85 75" stroke-width="5.6" />
      <path d="M 73 17.5 C 82 32, 81 59, 56 71.5" stroke-width="5.4" />
    </g>
    <circle cx="50" cy="32.5" r="4.4" fill="#324729" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="#324729" stroke-width="6" />
  </g>

  <!-- Main Brand Name -->
  <text
    x="160"
    y="246"
    text-anchor="middle"
    fill="#324729"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="48"
    letter-spacing="5"
  >SAPPY</text>

  <!-- Tagline -->
  <text
    x="160"
    y="286"
    text-anchor="middle"
    fill="#324729"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="21"
    letter-spacing="0.2"
  >stationery &amp; printing.</text>
</svg>
